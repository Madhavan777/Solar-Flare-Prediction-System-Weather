name: CI

# The data (190 MB) and the raw archives (5.7 GB) are not in the repository, so
# CI runs the suite that does not need them. Tests marked `largedata` skip
# cleanly when data/ is absent, which is the point of those markers.
#
# The trained models ARE committed, so CI still checks that every pickle loads
# under the pinned scikit-learn and that the stored predictions reproduce the
# published confusion matrix.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Report the environment
        run: python -m solarflare env

      - name: Lint
        run: |
          python -m ruff check .
          python -m black --check .

      - name: Tests that do not need the dataset
        run: python -m pytest -q -m "not playwright"

      - name: Consistency check
        run: python scripts/check_consistency.py

  dashboard:
    name: dashboard smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
          python -m playwright install --with-deps chromium

      - name: JavaScript / scikit-learn parity
        run: python -m pytest -q tests/test_js_parity.py

      - name: Every dashboard view, headless
        run: python -m pytest -q tests/test_dashboard.py

      - name: Upload the screenshots
        if: always()
        run: python -m solarflare screenshots || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-screenshots
          path: docs/screenshots/
          if-no-files-found: ignore
